<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>project1</title>
  <style>
    :root { --bg: #f6f5f1; --fg: #161616; --muted: #6b6b6b; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #f2f2f2; --muted: #9a9a9a; } }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px;
           background: var(--bg); color: var(--fg);
           font-family: system-ui, -apple-system, "Pretendard", "Apple SD Gothic Neo", sans-serif; }
    main { max-width: 560px; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -0.03em; }
    p { margin-top: 12px; color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>project1</h1>
    <p>Claude → GitHub → Cloudflare 배포가 정상적으로 연결되었습니다.</p>
  </main>
</body>
</html>
